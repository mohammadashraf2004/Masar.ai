<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Masar">
  <!-- The Waypoint mark in its amber tile: the 24px glyph (rails at x=4/20,
       node r=4.5, stroke 2.4) at half the tile, so 14px in a 28px tile.
       Same geometry as components/brand/MasarMark.tsx. -->
  <rect width="64" height="64" rx="14" fill="#F59E0B"/>
  <g transform="translate(16 16) scale(1.3333)" fill="none" stroke="#080A0E" stroke-width="2.4">
    <path d="M4 3.5V20.5"/>
    <path d="M20 3.5V20.5"/>
    <circle cx="12" cy="12" r="4.5" fill="#080A0E" stroke="none"/>
  </g>
</svg>
