name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_career_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ai_career_platform_test
      SECRET_KEY: ci-test-secret-key-not-for-production-use-only
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Import every model module (catches missing-import regressions)
        working-directory: backend
        run: python -c "import app.main"

      - name: Run Alembic migration chain against a clean db
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest -v

      - name: Dependency vulnerability audit
        working-directory: backend
        # Fails the build on a known-vulnerable pinned dependency. Runs
        # after the tests so a real regression is reported first.
        run: |
          pip install pip-audit==2.7.3
          pip-audit --requirement requirements.txt --strict

      - name: Check no .env file is tracked in git
        run: |
          if git ls-files --error-unmatch backend/.env frontend/.env.local 2>/dev/null; then
            echo "A real .env file is tracked by git — remove it and rotate every secret it held."
            exit 1
          fi
          echo "No tracked .env files."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (also runs the TypeScript type check)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

      - name: Dependency vulnerability audit (runtime deps)
        working-directory: frontend
        # The backend had pip-audit in CI from the start; the frontend had
        # no equivalent, which is exactly why a batch of high-severity
        # advisories in the runtime dependencies went unnoticed. --omit=dev
        # keeps the gate on what actually ships to users.
        run: npm audit --omit=dev --audit-level=high
