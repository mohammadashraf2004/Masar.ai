# Docker's default json-file log driver has NO rotation — verified during
# the 2026-09 reliability gate: neither this file nor the Docker daemon's
# default config set max-size/max-file anywhere, so every container's
# stdout/stderr (including the api's structured `security` logger, which is
# exactly the audit trail DEPLOYMENT.md §4 says to ship off-host) grows
# without bound on the host disk for the life of the container. Applied to
# every service via this anchor rather than repeated per-service, so a
# future added service inherits it by using `<<: *logging` rather than by
# someone remembering to copy five lines.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ─── PostgreSQL with pgvector ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Compose interpolates each file independently and BEFORE merging,
      # so a `:?required` here would break plain `docker compose up` in
      # development (the dev overlay can't satisfy it). The real
      # production guard is app/core/config.py, which refuses to boot with
      # APP_ENV=production while DATABASE_URL still carries these dev
      # credentials. Set POSTGRES_PASSWORD in the environment before any
      # production deploy.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_career_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO published port. Publishing 5432 binds it to every interface on
    # the host, so on any machine with a public IP the production database
    # is directly reachable from the internet, protected only by the
    # POSTGRES_PASSWORD (which defaults to "password"). The api service
    # reaches it over the compose network as `db:5432` and needs no
    # published port at all. docker-compose.dev.yml publishes it for local
    # development, and is only merged when named explicitly:
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    expose:
      - "5432"
    # The API alone can open 4 gunicorn workers x (pool_size 10 + max_overflow
    # 20) = 120 connections (app/db/session.py), before the metrics exporter
    # and the backup job. Postgres defaults to 100, so a burst of traffic ended
    # in "sorry, too many clients already" and a wave of 500s. On a managed
    # database this line does not apply: check the plan's connection limit
    # against that same arithmetic.
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis (shared rate-limit / login-lockout counters) ────────────
  # REQUIRED, not optional: the api service below runs gunicorn with 4
  # workers, and slowapi's default in-memory counters are per-process, so
  # without shared storage a documented "10/minute" login limit really
  # admits 40/minute and the per-account lockout resets per worker.
  # app/core/config.py refuses to start in production without REDIS_URL.
  # Not published to the host — only the api service needs to reach it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── FastAPI Backend ───────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      # Always overridden regardless of backend/.env — a host-local
      # DATABASE_URL (e.g. localhost:5432) wouldn't resolve inside the
      # container network anyway, so this one MUST be the docker-internal
      # host.
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ai_career_platform}
      # No hard requirement here — app/core/config.py already refuses to
      # boot when APP_ENV=production and this is left at the default/short.
      # Generate a real one with: openssl rand -hex 32
      # Same reasoning as POSTGRES_PASSWORD above: the default keeps local
      # dev working, and app/core/config.py refuses to start with
      # APP_ENV=production unless this is a real random value of 32+ chars.
      # Generate one with: openssl rand -hex 32
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Bare passthroughs (no `=value`): only injected into the container
      # if actually set in the host shell/.env-passed-to-compose. Giving
      # these a `${VAR:-default}` fallback like the ones above would set
      # a real container env var either way, which — since pydantic-settings
      # prioritizes real env vars over backend/.env — would silently shadow
      # whatever a developer configured in backend/.env for local dev.
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      # Base URL for any OpenAI-compatible endpoint. Leave unset for
      # api.openai.com; point it at a local model server or gateway
      # (Ollama, vLLM, LiteLLM, LM Studio, OpenRouter) to self-host
      # inference. Without this passthrough the value in backend/.env is
      # silently ignored under Docker.
      - OPENAI_API_URL
      - GENERATION_BACKEND
      - GENERATION_MODEL_ID
      - EXTRA_CORS_ORIGINS
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Metrics. /metrics is served on this same published port, so it is
      # bearer-token gated; app/core/config.py refuses to boot in
      # production with METRICS_ENABLED and no token.
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_TOKEN=${METRICS_TOKEN:-local-dev-metrics-token}
      # Four gunicorn workers each keep their own counters in memory, so
      # they are written to this shared directory instead and summed at
      # scrape time. gunicorn.conf.py empties it at boot and retires a
      # worker's files when it dies — without both, the numbers drift up
      # forever. See backend/app/core/metrics.py.
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-multiproc
      - RESEND_API_KEY
      - EMAIL_FROM
      # Payments: Kashier takes every new payment (app/services/payments/checkout.py).
      - PAYMENTS_ENABLED=${PAYMENTS_ENABLED:-false}
      - KASHIER_MODE=${KASHIER_MODE:-test}
      - KASHIER_MERCHANT_ID
      - KASHIER_API_KEY
      - KASHIER_SECRET_KEY
      - KASHIER_PUBLIC_API_URL
      # Paymob: historical only - its webhook still reconciles the orders it took.
      - PAYMOB_API_KEY
      - PAYMOB_INTEGRATION_ID_CARD
      - PAYMOB_INTEGRATION_ID_WALLET
      - PAYMOB_IFRAME_ID
      - PAYMOB_HMAC_SECRET
      # Project Lab: learner Python/SQL runs in the project-runner service
      # below, never in this container. The token default only suits local
      # runs; app/core/config.py refuses it in production.
      - PROJECT_LAB_EXECUTION_BACKEND=${PROJECT_LAB_EXECUTION_BACKEND:-runner}
      - PROJECT_LAB_RUNNER_SOCKET=/run/project-runner/runner.sock
      - PROJECT_LAB_RUNNER_TOKEN=${PROJECT_LAB_RUNNER_TOKEN:-local-dev-runner-token-change-me}
      # true when the runner runs under gVisor (PROJECT_RUNNER_RUNTIME=runsc):
      # the API then refuses to hand learner code to a runner that does not
      # report gVisor, so a host misconfiguration fails loudly.
      - PROJECT_LAB_REQUIRE_GVISOR=${PROJECT_LAB_REQUIRE_GVISOR:-false}
      # Production startup validates these values against the live runner.
      # They are passed to the API for validation only; the API never receives
      # the Docker socket and cannot change the host runtime.
      - PROJECT_RUNNER_RUNTIME=${PROJECT_RUNNER_RUNTIME:-runc}
      - PROJECT_RUNNER_SECCOMP=${PROJECT_RUNNER_SECCOMP:-runner-seccomp.json}
      - PROJECT_RUNNER_REQUIRE_GVISOR=${PROJECT_RUNNER_REQUIRE_GVISOR:-0}
      - PROJECT_RUNNER_PIDS_LIMIT=${PROJECT_RUNNER_PIDS_LIMIT:-128}
      # Behind Caddy every request's TCP peer is the proxy. Without these two
      # the rate limiter keys every visitor on Caddy's address: one shared
      # login/register budget for the whole internet (app/core/limiter.py).
      # Set in /etc/masar/production.env; 0 / empty is right with no proxy.
      - TRUSTED_PROXY_COUNT=${TRUSTED_PROXY_COUNT:-0}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
    # The api reaches the project-runner ONLY through this socket volume:
    # the runner has no network at all. The directory inside is
    # root:<appuser gid> mode 2750 (seeded from the runner image), so the api
    # can connect and learner code inside the runner cannot.
    volumes:
      - project_runner_socket:/run/project-runner
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Deliberately NOT project-runner: Compose must be able to boot the API
      # while the production kill switch is set to `disabled`, even when the
      # host has no runsc runtime. When production execution is `runner`, the
      # API's own startup attestation below fails closed if the runner is
      # absent or not gVisor. A Compose dependency (even `required: false`)
      # made `docker compose up -d api` fail before the disabled API could
      # start (verified 2026-10-07). Start order is not needed for the socket:
      # Docker seeds it from the runner image's /run/project-runner
      # (root:1000, mode 2750) on the runner's first mount even when the api
      # mounted the new, empty volume first (verified).
    command: gunicorn app.main:app -c gunicorn.conf.py -k uvicorn.workers.UvicornWorker -w 4 --bind 0.0.0.0:8000 --timeout 60
    # tmpfs, not a volume: these are per-run scratch files that must not
    # survive a restart — stale ones are counted as live workers.
    # uid/gid must match the non-root appuser in the image: a tmpfs mounts
    # root-owned, and the metrics middleware then fails every request with
    # PermissionError.
    tmpfs:
      - /tmp/prometheus-multiproc:uid=1000,gid=1000,mode=0755
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Project Lab runner (untrusted learner code) ────────────────────
  # Executes learner Python/SQL for the Project Lab. Its isolation is the
  # security boundary for that code — see backend/project_runner/server.py
  # and docs/project-lab.md ("Security boundary") before loosening anything:
  #   * network_mode: none — no interface but loopback, so neither the
  #     service nor learner code can reach the api, db, redis, frontend,
  #     proxy, Docker host, cloud metadata or the internet. The api talks to
  #     it over a Unix socket on the project_runner_socket volume, in a
  #     directory the sandbox user cannot traverse;
  #   * no application secrets: its environment is the runner token only;
  #   * read-only root filesystem; job directories on a size-capped tmpfs;
  #   * every capability dropped except SETUID/SETGID (to hand each job to
  #     the unprivileged `sandbox` user); no-new-privileges;
  #   * a restrictive seccomp allowlist (backend/project_runner/seccomp/);
  #   * pids/memory/CPU caps for the whole service, rlimits per job;
  #   * gVisor is optional for local development, but mandatory whenever a
  #     production API enables learner execution: PROJECT_RUNNER_RUNTIME=runsc with
  #     PROJECT_RUNNER_SECCOMP=runner-seccomp-gvisor.json and
  #     PROJECT_RUNNER_REQUIRE_GVISOR=1 (host setup in docs/project-lab.md).
  project-runner:
    build:
      context: ./backend/project_runner
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    runtime: ${PROJECT_RUNNER_RUNTIME:-runc}
    environment:
      - RUNNER_TOKEN=${PROJECT_LAB_RUNNER_TOKEN:-local-dev-runner-token-change-me}
      # "1": the runner refuses to start unless it is running under gVisor.
      - RUNNER_REQUIRE_GVISOR=${PROJECT_RUNNER_REQUIRE_GVISOR:-0}
    volumes:
      - ./backend/project_templates:/templates:ro
      - project_runner_socket:/run/project-runner
    network_mode: none
    read_only: true
    tmpfs:
      # 1733: every job creates its own directory (as the sandbox user);
      # nobody can list the root, and only an entry's owner can remove it.
      # nr_inodes caps how many files a job can create; Docker also mounts
      # tmpfs noexec/nosuid/nodev, so nothing written there can be executed.
      - /jobs:size=256m,mode=1733,nr_inodes=16384
      - /tmp:size=16m,mode=0755
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
      - seccomp=./backend/project_runner/seccomp/${PROJECT_RUNNER_SECCOMP:-runner-seccomp.json}
    # Host-level pid cap for the whole container. Learner processes are
    # capped per job by RLIMIT_NPROC (32) inside the sandbox; under gVisor
    # every guest process also costs host stub processes/threads (34 host
    # pids idle, 107 measured during one fork bomb), and when the host
    # clone() fails the gVisor sentry panics ("createSysmsgThread: failed to
    # get clone") and the runner restarts. So gVisor needs headroom:
    # PROJECT_RUNNER_PIDS_LIMIT=512 (see deploy/production.env.example).
    pids_limit: ${PROJECT_RUNNER_PIDS_LIMIT:-128}
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-I", "/opt/runner/project_runner/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Next.js Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_MENTOR_V2_LIVE: ${NEXT_PUBLIC_MENTOR_V2_LIVE:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_PAYMENTS_PROVIDER: ${NEXT_PUBLIC_PAYMENTS_PROVIDER:-}
    restart: unless-stopped
    logging: *logging
    environment:
      # The standalone server.js binds to this interface — without it,
      # it only listens on the container's specific bridge IP, not
      # 127.0.0.1. External requests still work fine (Docker's port
      # publishing routes straight to that IP), but anything running
      # *inside* the container and calling `localhost:3000` — like our
      # own healthcheck below — gets ECONNREFUSED.
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Monitoring ────────────────────────────────────────────────────
  # Prometheus and Grafana are bound to 127.0.0.1 deliberately. Grafana
  # ships with a default admin login and Prometheus has no auth at all;
  # neither belongs on a public interface. Reach them through an SSH
  # tunnel on a server, or put them behind your own authenticating proxy.

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    logging: *logging
    # Writes the scrape credential from the environment into a file
    # Prometheus can read, so METRICS_TOKEN lives in one place instead of
    # being duplicated into a committed config file.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$${METRICS_TOKEN:-local-dev-metrics-token}" > /etc/prometheus/token
        exec /bin/prometheus           --config.file=/etc/prometheus/prometheus.yml           --storage.tsdb.path=/prometheus           --storage.tsdb.retention.time=15d           --web.enable-lifecycle
    environment:
      - METRICS_TOKEN=${METRICS_TOKEN:-local-dev-metrics-token}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    logging: *logging
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # Nothing here should be reachable without logging in, and this
      # instance has no business phoning home or letting people self-serve
      # accounts.
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy

  # Postgres connection saturation is the failure that takes the app down
  # while the app itself still looks healthy.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    logging: *logging
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ai_career_platform}?sslmode=disable
    expose:
      - "9187"
    depends_on:
      db:
        condition: service_healthy

  # Rate limits and login lockouts live in Redis — if it evicts under
  # memory pressure, those stop being enforced without any error.
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    logging: *logging
    command: ["--redis.addr", "redis://redis:6379"]
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  # The api <-> project-runner control socket (see the project-runner service).
  project_runner_socket:
  postgres_data:
  prometheus_data:
  grafana_data:
