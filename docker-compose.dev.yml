# Local development overlay. NOT auto-loaded — must be named explicitly.
#
# This file was called docker-compose.override.yml until that was found to be
# a production footgun: Compose auto-loads `docker-compose.override.yml`, so a
# plain `docker compose up` on a server silently merged everything below —
# APP_ENV=development, --reload, a source bind-mount and a published Postgres
# port. Worst of all, APP_ENV=development switches OFF every fail-fast guard
# in app/core/config.py, so the stack would boot happily with the default
# SECRET_KEY, no Redis, public /docs and localhost CORS origins allowed with
# credentials. Renaming it is what makes `docker compose up -d` production-safe
# by default.
#
# Local development therefore asks for it explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  # Development-only: expose Postgres on the host so psql / a GUI client /
  # a natively-run backend can reach it. docker-compose.yml deliberately
  # does not publish this port, so the default production run
  # (`docker compose up -d`) keeps the database off the host's network
  # interfaces entirely.
  db:
    ports:
      - "5432:5432"

  api:
    environment:
      APP_ENV: development
      # Empty (not absent — compose can't unset an inherited var) so metrics
      # use the ordinary in-process registry. Multiprocess mode is for the
      # 4-worker gunicorn run; under `--reload` each reload forks a new pid
      # whose metric files nothing ever retires, so counters would only ever
      # climb.
      #
      # An empty value alone does NOT disable it: prometheus_client switches
      # on the presence of the key, so "" turned multiprocess mode on and
      # wrote counter_*.db / gauge_livesum_*.db / histogram_*.db into the
      # working directory (the bind-mounted source tree below). What makes
      # this line mean what it says is _sanitize_multiproc_env() in
      # backend/app/core/metrics.py, which deletes a blank key before
      # prometheus_client is imported. Keep the two together.
      PROMETHEUS_MULTIPROC_DIR: ""
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # No override needed for frontend: it always runs the standalone
  # production build (`node server.js`) in both dev and prod compose runs
  # — there's no `next dev` mode wired into the Dockerfile. Forcing
  # NODE_ENV=development here previously broke routing on the prod build
  # artifact (buildId fell back to "development", pages 404'd).
